    FX.state.curtainUp = false;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    FX.state.reduced = reduced;
    const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
    this.mqW = matchMedia('(min-width: 768px)');
    this.onW = () => this.setState({ wide: this.mqW.matches });
    this.mqW.addEventListener('change', this.onW);
    this.setState({ reduced, fine, wide: this.mqW.matches }, () => this.boot());
    this.onKey = e => { if (e.key === 'Escape' && this.state.menu) this.setState({ menu: false }); };
    window.addEventListener('keydown', this.onKey);
    // Celular: o botão Menu some ao rolar para baixo (para não cobrir o texto) e volta ao rolar para cima.
    this.lastY = window.scrollY;
    this.onScroll = () => {
      const y = window.scrollY, dy = y - this.lastY;
      if (Math.abs(dy) < 6) return;
      this.lastY = y;
      const hide = !this.state.wide && !this.state.menu && dy > 0 && y > 120;
      if (hide !== this.state.navHide) this.setState({ navHide: hide });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    document.addEventListener('click', this.onClick);
    document.addEventListener('focusin', this.onFocus);
  }
  componentWillUnmount() {
    clearTimeout(this._bt); clearTimeout(this._snapT); clearTimeout(this._navT);
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('scroll', this.onScroll);
    document.removeEventListener('click', this.onClick);
    document.removeEventListener('focusin', this.onFocus);
    this.mqW && this.mqW.removeEventListener('change', this.onW);
    if (this.onMove) { window.removeEventListener('mousemove', this.onMove); window.removeEventListener('mouseover', this.onOver); document.removeEventListener('mouseleave', this.onLeave); }
    document.documentElement.classList.remove('pd-cursor');
    this.killMotion(); this.killLenis(); this.killGrain();
  }
  // O dc-runtime só repassa prevProps; o estado anterior é guardado aqui.
  componentDidUpdate(pp, ps = this._prevState || this.state) {
    this._prevState = { ...this.state };
    if (ps.menu !== this.state.menu && window.gsap) {
      if (this.state.menu) {
        this.lenis && this.lenis.stop();
        const m = this.menuRef.current;
        if (m) {
          if (!this.state.reduced) gsap.from(m.querySelectorAll('[data-mi]'), { y: 36, opacity: 0, duration: .6, ease: 'power3.out', stagger: .04 });
          const first = m.querySelector('a'); first && first.focus({ preventScroll: true });
        }
      } else { this.lenis && this.lenis.start(); }
    }
    if (pp.emendas !== this.props.emendas && this.settled) { this.buildMotion(); ScrollTrigger.refresh(); }
  }

  secs() { const m = this.mainRef.current; return m ? [...m.querySelectorAll('[data-pd-sec]')] : []; }
  indexFromHash(h) {
    const k = (h || '').replace(/^#\/?/, '').toLowerCase();
    if (!k) return -1;
    return Component.T.findIndex(s => s.id === k || s.key === k);
  }
  setCur(i) { if (i !== this.state.cur) this.setState({ cur: i }); }

  boot() {
    const w = () => {
      if (!(window.gsap && window.ScrollTrigger && window.PapoFX && PapoFX.noise && PapoFX.joint)) { this._bt = setTimeout(w, 40); return; }
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.config({ ignoreMobileResize: true, limitCallbacks: true });
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (this.indexFromHash(location.hash) < 0) window.scrollTo(0, 0);
      this.initLenis(); this.initGrain(); this.initCursor(); this.intro();
    };
    w();
  }
  initLenis() {
    if (this.lenis || this.state.reduced || !window.Lenis || matchMedia('(pointer: coarse)').matches) return;
    this.lenis = new Lenis({ lerp: .085, smoothWheel: true, wheelMultiplier: .9, touchMultiplier: 1.4 });
    PapoFX.lenis = this.lenis; // usado para rolar até um ponto (ex.: Atrações → horário no cronograma)
    this.lenis.on('scroll', ScrollTrigger.update);
    this.raf = t => this.lenis && this.lenis.raf(t * 1000);
    gsap.ticker.add(this.raf); gsap.ticker.lagSmoothing(0);
  }
  killLenis() {
    if (!this.lenis) return;
    window.gsap && gsap.ticker.remove(this.raf);
    this.lenis.destroy(); this.lenis = null; if (window.PapoFX) PapoFX.lenis = null;
  }
  initGrain() {
    const g = this.grainRef.current; if (!g) return;
    g.style.backgroundImage = 'url(' + PapoFX.noise() + ')';
    this.killGrain();
    if (this.state.reduced) return;
    // granulado estático: animar uma camada fixa de tela inteira custava um repaint a cada 90ms

  }
  killGrain() { if (this.grainTick && window.gsap) { gsap.ticker.remove(this.grainTick); this.grainTick = null; } }
  initCursor() {
    if (!this.state.fine) return;
    const d = this.dotRef.current, r = this.ringRef.current; if (!d || !r) return;
    document.documentElement.classList.add('pd-cursor');
    const dx = gsap.quickTo(d, 'x', { duration: .06 }), dy = gsap.quickTo(d, 'y', { duration: .06 });
    const rx = gsap.quickTo(r, 'x', { duration: .35, ease: 'power3' }), ry = gsap.quickTo(r, 'y', { duration: .35, ease: 'power3' });
    this.onMove = e => {
      dx(e.clientX); dy(e.clientY); rx(e.clientX); ry(e.clientY);
      if (!this.cursorOn) { this.cursorOn = true; gsap.to([d, r], { opacity: 1, duration: .2 }); }
    };
    this.onOver = e => {
      const hit = e.target.closest && e.target.closest('a,button,[data-cursor],[data-drag],[data-handle],image-slot');
      gsap.to(r, { scale: hit ? 1.9 : 1, duration: .3, ease: 'power3.out' });
    };
    this.onLeave = () => { this.cursorOn = false; gsap.to([d, r], { opacity: 0, duration: .2 }); };
    window.addEventListener('mousemove', this.onMove, { passive: true });
    window.addEventListener('mouseover', this.onOver);
    document.addEventListener('mouseleave', this.onLeave);
  }

  // A intro só começa quando a imagem da logo já está decodificada (máx. 2,5s), então ela nunca some.
  intro() {
    const img = this.curtainImgRef.current;
    if (!this._introWait && img && !(img.complete && img.naturalWidth)) {
      this._introWait = true;
      let done = false; const go = () => { if (done) return; done = true; this.intro(); };
      (img.decode ? img.decode() : Promise.reject()).then(go, () => { img.addEventListener('load', go, { once: true }); });
      gsap.delayedCall(2.5, go);
      const c = this.curtainRef.current; c && gsap.set(c, { visibility: 'visible', yPercent: 0, opacity: 1 });
      return;
    }
    const c = this.curtainRef.current, l = this.curtainLogoRef.current, red = this.state.reduced;
    this.lenis && this.lenis.stop();
    gsap.set(c, { visibility: 'visible', yPercent: 0, opacity: 1 });
    const tl = gsap.timeline({ delay: .2, onComplete: () => this.waitSections(() => this.lift()) });
    if (red) tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: .4 });
    else tl.fromTo(l, { scale: .5, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: .9, ease: 'elastic.out(1,.6)' });
    tl.to({}, { duration: .45 });
  }
  waitSections(cb, n = 0) {
    const m = this.mainRef.current;
    const ready = m && m.querySelectorAll('[data-screen-label]').length >= 9;
    if (ready || n > 100) cb(); else gsap.delayedCall(.05, () => this.waitSections(cb, n + 1));
  }
  lift() {
    const c = this.curtainRef.current, l = this.curtainLogoRef.current, red = this.state.reduced;
    PapoFX.state.curtainUp = true;
    window.dispatchEvent(new CustomEvent('papo:revealed'));
    gsap.delayedCall(.08, () => this.settle());
    const tl = gsap.timeline({ onComplete: () => { gsap.set(c, { visibility: 'hidden' }); this.lenis && this.lenis.start(); } });
    if (red) tl.to(c, { opacity: 0, duration: .35 });
    else {
      tl.to(l, { scale: 1.08, opacity: 0, duration: .25, ease: 'power2.in' });
      tl.to(c, { yPercent: -100, duration: .7, ease: 'power4.inOut' }, '<.08');
    }
  }
  settle() {
    const go = () => {
      this.buildMotion();
      ScrollTrigger.refresh();
      this.settled = true;
      const i = this.indexFromHash(location.hash);
      if (i > 0) this.goTo(i, true);
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
  }

  killMotion() { if (this.mm) { this.mm.revert(); this.mm = null; } this.joints = []; }
  buildMotion() {
    this.killMotion();
    const secs = this.secs(); if (secs.length < 9) return;
    const T = Component.T, red = this.state.reduced;
    const src = window.PAPO_JOINTS || { JOINTS: [], JOINTS_DEMO: [] };
    const list = (this.props.emendas === 'Demonstração' ? src.JOINTS_DEMO : src.JOINTS) || [];
    if (!red && list.some(j => j.transition !== 'T5')) {
      const w = PapoFX.validateJoints(list, T.map(s => s.bg));
      if (w.length) console.warn('[Papo Dom] JOINTS fora das regras:\n· ' + w.join('\n· '));
    }
    this.mm = gsap.matchMedia();
    this.mm.add({ all: 'all', desk: '(min-width: 1024px)', mob: '(max-width: 767px)' }, ctx => {
      const c = ctx.conditions, pinned = new Set();
      this.joints = [];
      // Celular (< 768px): sem emendas sobrepostas. As seções seguem empilhadas, com respiro entre elas,
      // e cada uma entra com um fade curto. Nada fica preso por cima de outra.
      const flat = red || c.mob;
      if (!flat) {
        pinned.add(1);
        list.forEach(jt => {
          const k = jt.from - 1, out = secs[k], inn = secs[jt.to - 1];
          if (!out || !inn) return;
          const type = PapoFX.resolveTransition(jt.transition, c);
          if (type === 'T6') pinned.add(k);
          this.joints[k] = PapoFX.joint({ type, side: jt.side, keepBg: jt.keepBg, out, inn, bgOut: T[k].bg, bgIn: T[jt.to - 1].bg, layer: this.fxRef.current, prio: 100 - k * 10 - 5 });
        });
      } else {
        if (red) secs.forEach((s, i) => {
          if (!i) return;
          ScrollTrigger.create({ trigger: s, start: 'top 92%', once: true, onEnter: () => gsap.fromTo(s, { opacity: 0 }, { opacity: 1, duration: .2, ease: 'none', clearProps: 'opacity' }) });
        });
        // Celular: a seção que entra sobe como um cartão (cantos arredondados, levemente menor) e se abre
        // até a largura total. O fundo da página assume a cor da seção anterior durante a entrada, então
        // nunca aparece faixa preta. Só transform e border-radius, sem sticky.
        else {
          const main = this.mainRef.current;
          secs.forEach((s, i) => {
            if (!i) return;
            const prevBg = T[i - 1].bg;
            const set = p => {
              const e = 1 - Math.pow(1 - p, 3);
              if (p > 0 && p < 1) {
                main.style.background = prevBg;
                s.style.willChange = 'transform';
                gsap.set(s, { scale: .9 + .1 * e, transformOrigin: '50% 0%', borderTopLeftRadius: (1 - e) * 32, borderTopRightRadius: (1 - e) * 32, force3D: true });
              } else {
                s.style.willChange = '';
                gsap.set(s, { clearProps: 'transform,borderTopLeftRadius,borderTopRightRadius' });
              }
            };
            ScrollTrigger.create({ trigger: s, start: 'top bottom', end: 'top 30%', onUpdate: st => set(st.progress), onRefresh: st => set(st.progress), onToggle: st => { if (!st.isActive) set(st.progress >= 1 ? 1 : 0); } });
          });
        }
      }
      // Emendas travadas: passou de 4% do curso, a rolagem trava e a transição termina sozinha na direção
      // em que o usuário vinha (desce → próxima seção, sobe → volta). Ninguém fica parado no meio.
      if (!flat) this.joints.forEach(j => {
        // encaixe automático só na emenda 02 → 03
        if (!j || j !== this.joints[1]) return;
        ScrollTrigger.create({
          start: () => j.st.start, end: () => j.st.end, refreshPriority: -100,
          onUpdate: st => {
            if (this.snapping || this.navigating || !this.lenis || !this.settled) return;
            const p = st.progress;
            if (p > .04 && p < .96) this.snapTo(st.direction > 0 ? st.end : st.start);
          }
        });
      });
      secs.forEach((s, i) => ScrollTrigger.create({ trigger: s, start: 'top 50%', end: 'bottom 50%', onToggle: st => { if (st.isActive) this.setCur(i); } }));
      return () => { this.joints.forEach(j => j && j.kill()); this.joints = []; secs.forEach(s => { s.style.marginTop = ''; s.style.willChange = ''; gsap.set(s, { clearProps: 'transform,borderTopLeftRadius,borderTopRightRadius' }); }); };
    });
  }

  snapTo(y) {
    const dist = Math.abs(y - window.scrollY), h = window.innerHeight || 1;
    this.snapping = true;
    this.lenis.scrollTo(y, {
      duration: Math.max(.55, Math.min(1.3, dist / h * 1.25)), easing: t => 1 - Math.pow(1 - t, 3),
      lock: true, force: true, onComplete: () => { this.snapping = false; }
    });
    clearTimeout(this._snapT); this._snapT = setTimeout(() => { this.snapping = false; }, 1600);
  }
  naturalTop(i) {
    if (i <= 0) return 0;
    const j = this.joints[i - 1];
    if (j) return j.st.end;
    const s = this.secs()[i];
    return s ? s.getBoundingClientRect().top + window.scrollY : 0;
  }
  goTo(i, immediate) {
    const s = this.secs()[i]; if (!s) return;
    const done = () => s.focus({ preventScroll: true });
    if (this.lenis) {
      this.lenis.start();
      const dist = Math.abs(i - this.state.cur);
      this.navigating = true; this.snapping = false;
      const fin = () => { this.navigating = false; done(); };
      this.lenis.scrollTo(this.naturalTop(i), { immediate: !!immediate, force: true, duration: 1 + Math.min(1.4, dist * .18), onComplete: fin });
      clearTimeout(this._navT); this._navT = setTimeout(() => { this.navigating = false; }, 3000);
      if (immediate) done();
    } else {
      const m = i ? (parseFloat(getComputedStyle(s).scrollMarginTop) || 0) : 0;
      window.scrollTo({ top: Math.max(0, s.getBoundingClientRect().top + window.scrollY - m), behavior: this.state.reduced || immediate ? 'auto' : 'smooth' });
      done();
    }
  }
  onClick = e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a) return;
    const i = this.indexFromHash(a.getAttribute('href')); if (i < 0) return;
    e.preventDefault();
    if (this.state.menu) { this.setState({ menu: false }); gsap.delayedCall(.05, () => this.goTo(i)); }
    else this.goTo(i);
  };
  // Teclado: ao focar algo dentro de uma seção, a rolagem é trazida para o trecho em que a seção
  // está assentada (fora de qualquer emenda), então o foco nunca cai em conteúdo coberto ou pinado.
  onFocus = e => {
    if (!this.lenis || !this.settled) return;
    const t = e.target; if (!t || !t.closest || t.hasAttribute('data-pd-sec')) return;
    let vis = false; try { vis = t.matches(':focus-visible'); } catch (_) {}
    if (!vis) return;
    const s = t.closest('[data-pd-sec]'); if (!s) return;
    const i = +s.getAttribute('data-pd-sec');
    const lo = this.naturalTop(i), nx = this.joints[i];
    const hi = Math.max(lo, nx ? nx.st.start : ScrollTrigger.maxScroll(window));
    const jump = y => { this.lenis.scrollTo(y, { immediate: true, force: true }); ScrollTrigger.update(); };
    const y = Math.min(hi, Math.max(lo, window.scrollY)); jump(y);
    const r = t.getBoundingClientRect(), h = window.innerHeight;
    if (r.top < 80 || r.bottom > h - 40) jump(Math.min(hi, Math.max(lo, y + r.top - h * .35)));
  };

  toggleFx = () => {
    const reduced = !this.state.reduced;
    if (window.PapoFX) PapoFX.state.reduced = reduced;
    try { localStorage.setItem('papodom-reduced', reduced ? '1' : '0'); } catch (e) {}
    this.setState({ reduced }, () => {
      if (!window.gsap) return;
      this.killMotion();
      if (reduced) { this.killLenis(); this.killGrain(); } else { this.initLenis(); this.initGrain(); }
      gsap.delayedCall(.08, () => { this.buildMotion(); ScrollTrigger.refresh(); });
    });
  };

  renderVals() {
    const T = Component.T, cur = this.state.cur, t = T[cur];
    const menuOpen = this.state.menu, grain = this.props.grao ?? 0.1;
    const onYellow = t.bg === '#EBF06B', inkDark = t.ink === '#0A0A0A';
    const low = cur >= 5;
    return {
      t,
      menu: T.map((s, i) => ({ href: '#' + s.id, n: s.n, label: s.menu, current: i === cur ? 'location' : undefined, dot: i === cur })),
      marks: T.map((s, i) => ({
        href: '#' + s.id, label: s.label, current: i === cur ? 'location' : undefined,
        w: i === cur ? '3px' : '1px',
        color: i === cur ? (onYellow ? '#7433E6' : '#EBF06B') : (inkDark ? 'rgba(10,10,10,.25)' : 'rgba(255,255,255,.25)')
      })),
      railTop: low ? 'auto' : (cur / 9 * 100).toFixed(2) + '%',
      railBottom: low ? ((8 - cur) / 9 * 100).toFixed(2) + '%' : 'auto',
      showRail: this.state.wide,
      menuOpen, menuLabel: menuOpen ? 'Fechar' : 'Menu',
      navY: this.state.navHide ? 'translateY(-160%)' : 'none', navBg: menuOpen ? t.chromeInk : t.chromeBg, navInk: menuOpen ? t.chromeBg : t.chromeInk,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      skip: e => { e.preventDefault(); const m = this.mainRef.current; m && m.focus(); },
      reduced: this.state.reduced,
      fxLabel: this.state.reduced ? 'Efeitos reduzidos' : 'Reduzir efeitos',
      fxDot: this.state.reduced ? 'currentColor' : 'transparent',
      toggleFx: this.toggleFx,
      grainOpacity: (this.state.reduced ? grain * .6 : grain) * .45,
      fine: this.state.fine,
      dataEvento: this.props.dataEvento ?? '',
      mainRef: this.mainRef, menuRef: this.menuRef, grainRef: this.grainRef, fxRef: this.fxRef,
      curtainRef: this.curtainRef, curtainLogoRef: this.curtainLogoRef, curtainImgRef: this.curtainImgRef, ringRef: this.ringRef, dotRef: this.dotRef
    };
  }
}
</script>
