<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section ref="{{ root }}" data-screen-label="03 Linguagens" aria-labelledby="ling-title" style="position:relative;isolation:isolate;min-height:100svh;background:#0A0A0A;color:#FFFFFF;padding:clamp(100px,14vh,150px) clamp(20px,4vw,56px) clamp(56px,7vw,96px);overflow:hidden">
  <div data-bgl="" aria-hidden="true" style="position:absolute;inset:0;z-index:-1;pointer-events:none">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <div data-bg="{{ it.key }}" style="position:absolute;inset:0;background:{{ it.dark }};opacity:0"></div>
    </sc-for>
    <canvas data-pgrid="" style="position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0"></canvas>
  </div>

  <header data-head="" style="max-width:1320px;margin:0 auto clamp(28px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px clamp(24px,5vw,80px);align-items:end">
    <div style="display:flex;flex-direction:column;gap:16px">
      <p data-reveal="" style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase">03 · Linguagens</p>
      <h2 id="ling-title" data-reveal="" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:76%;font-size:clamp(52px,8vw,132px);line-height:.88;letter-spacing:-.045em">Linguagens</h2>
    </div>
    <p data-reveal="" style="font-family:'General Sans',sans-serif;font-weight:500;font-size:clamp(17px,1.4vw,20px);line-height:1.55;max-width:52ch;text-wrap:pretty">Cada versão da logo representa uma parte da comunicação nos anos 2000: a revista, a TV, a internet e o scrapbook. São quatro linguagens visuais da década com a mesma identidade.</p>
  </header>

  <div style="max-width:1320px;margin:0 auto;display:flex;flex-direction:{{ dir }};gap:12px;min-height:{{ rowH }}">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <div role="link" tabindex="0" data-block="{{ it.key }}" onClick="{{ it.go }}" onKeyDown="{{ it.key2 }}" onMouseEnter="{{ it.enter }}" onFocus="{{ it.enter }}" onMouseLeave="{{ leave }}" onBlur="{{ leave }}" aria-label="{{ it.aria }}" style="position:relative;flex:{{ flex }};min-width:0;border-radius:22px;overflow:hidden;background:{{ it.bg }};color:{{ it.fg }};text-decoration:none;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:clamp(20px,2vw,28px)">
        <div style="display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase">
          <span style="font-family:'Silkscreen',monospace;font-size:14px;letter-spacing:0">{{ it.n }}</span>
          <span style="text-align:right">{{ it.kind }}</span>
        </div>
        <div data-logo="" style="width:min(100%,280px);align-self:center">
          <dc-import name="Logo" variant="{{ it.logo }}" hint-size="100%,150px"></dc-import>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h3 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-stretch:82%;font-size:clamp(28px,2.6vw,40px);line-height:1;letter-spacing:-.02em">{{ it.name }}</h3>
          <p style="font-family:'General Sans',sans-serif;font-weight:500;font-size:16px;line-height:1.45">{{ it.theme }}</p>
          <span style="margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase">{{ it.dest }} ↓</span>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static ITEMS = [
    { key: 'revista', n: '04', kind: 'Revista / Pop', name: 'Revista', dest: 'Ver a turma', theme: 'Cultura jovem e identificação', bg: '#7433E6', fg: '#FFFFFF', accent: '#EBF06B', dark: '#1A0A3A', line: '#EBF06B', headInk: '#FFFFFF', logo: 'revista', href: '#04-revista' },
    { key: 'tv', n: '05', kind: 'TV / Cultura jovem', name: 'TV', dest: 'Ver o vídeo', theme: 'Televisão e cultura pop', bg: '#FF4D1A', fg: '#0A0A0A', accent: '#081680', dark: '#050A33', line: '#FF4D1A', headInk: '#FFFFFF', logo: 'tv', href: '#05-tv' },
    { key: 'web', n: '06', kind: 'Digital / Tecnologia', name: 'Web / Y2K', dest: 'Ver onde é', theme: 'Tecnologia e novas conexões', bg: '#2E3FE0', fg: '#FFFFFF', accent: '#7CB342', dark: '#0E1F08', line: '#8FD14F', headInk: '#FFFFFF', logo: 'web', href: '#06-web' },
    { key: 'scrap', n: '07', kind: 'Memória / Manual', name: 'Scrapbook', dest: 'Ver as atrações', theme: 'Memória e expressão', bg: '#C92A74', fg: '#FFFFFF', accent: '#FFFFFF', dark: '#330920', line: '#FF5FA8', headInk: '#FFFFFF', logo: 'scrap', href: '#07-scrapbook' }
  ];
  root = React.createRef();
  state = { wide: true };
  componentDidMount() {
    this.onRs = () => { const wide = innerWidth >= 900; if (wide !== this.state.wide) this.setState({ wide }); };
    this.onRs(); addEventListener('resize', this.onRs);
    const w = () => { if (window.PapoFX && PapoFX.page) this.fx = PapoFX.page(this.root, (el, red) => this.run(el, red)); else this._t = setTimeout(w, 40); }; w();
  }
  // O dc-runtime só repassa prevProps; o estado anterior é guardado aqui.
  componentDidUpdate(p, s = this._prevState || this.state) {
    this._prevState = { ...this.state };
    if (this.fx && p.reduced !== this.props.reduced) this.fx.restart();
    if (s.wide !== this.state.wide) this.leave();
  }
  componentWillUnmount() { clearTimeout(this._t); removeEventListener('resize', this.onRs); this.fx && this.fx.kill(); }
  run(el, red) {
    const blocks = el.querySelectorAll('[data-block]');
    const cv = el.querySelector('[data-pgrid]');
    this.grid = cv && PapoFX.perspectiveGrid ? PapoFX.perspectiveGrid(cv, el, { reduced: red, bg: '#0A0A0A', line: '#FFFFFF', alpha: .16 }) : null;
    if (this.grid) gsap.to(cv, { opacity: 1, duration: red ? .2 : 1.2, ease: 'power2.out' });
    const off = () => { if (this.grid) { this.grid.kill(); this.grid = null; } };
    if (red) { gsap.from(blocks, { opacity: 0, duration: .5, stagger: .06 }); return off; }
    gsap.from(blocks, { y: 80, opacity: 0, duration: .9, ease: 'power4.out', stagger: .1 });
    return off;
  }
  enter(k) {
    const el = this.root.current; if (!el || !window.gsap) return;
    const it = Component.ITEMS.find(i => i.key === k);
    el.querySelectorAll('[data-bg]').forEach(b => gsap.to(b, { opacity: b.getAttribute('data-bg') === k ? 1 : 0, duration: .55, ease: 'power2.out', overwrite: true }));
    gsap.to(el.querySelector('[data-head]'), { color: it.headInk, duration: .4, overwrite: true });
    this.grid && this.grid.set(it.dark, it.line, .42, 1.8);
    if (this.state.wide) el.querySelectorAll('[data-block]').forEach(b => {
      const on = b.getAttribute('data-block') === k;
      gsap.to(b, { flexGrow: on ? 2.3 : 1, duration: PapoFX.isReduced() ? 0 : .7, ease: 'power3.out', overwrite: 'auto' });
      gsap.to(b.querySelector('[data-logo]'), { scale: on ? 1.12 : 1, duration: .7, ease: 'back.out(1.6)', overwrite: 'auto' });
    });
  }
  // Navegação sem <a href>: o navegador não mostra a URL no rodapé ao passar o cursor.
  go(href) {
    const a = document.createElement('a');
    a.setAttribute('href', href); a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
  }
  leave = () => {
    const el = this.root.current; if (!el || !window.gsap) return;
    gsap.to(el.querySelectorAll('[data-bg]'), { opacity: 0, duration: .5, overwrite: true });
    gsap.to(el.querySelector('[data-head]'), { color: '#FFFFFF', duration: .4, overwrite: true });
    this.grid && this.grid.set('#0A0A0A', '#FFFFFF', .16, 1);
    el.querySelectorAll('[data-block]').forEach(b => {
      gsap.to(b, { flexGrow: 1, duration: .6, ease: 'power3.out', overwrite: 'auto' });
      gsap.to(b.querySelector('[data-logo]'), { scale: 1, duration: .6, overwrite: 'auto' });
    });
  };
  renderVals() {
    const wide = this.state.wide;
    return {
      root: this.root,
      items: Component.ITEMS.map(i => ({ ...i, enter: () => this.enter(i.key), go: () => this.go(i.href), key2: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.go(i.href); } }, aria: i.n + ' — ' + i.kind + ': ' + i.theme + '. ' + i.dest })),
      leave: this.leave,
      dir: wide ? 'row' : 'column',
      rowH: wide ? 'min(66vh,620px)' : '0',
      flex: wide ? '1 1 0' : 'none'
    };
  }
}
</script>
</body>
</html>
